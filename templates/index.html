<!DOCTYPE html>
<html>
<head>
    <title>Weather Trend Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2193b0, #6dd5ed);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 600px;
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #1565c0;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0d47a1;
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            text-align: center;
            background: #e3f2fd;
            border-radius: 10px;
        }

        .result h2 {
            color: #1565c0;
        }

        .about {
            margin-top: 25px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌦️ Weather Trend Prediction</h1>

    <p class="subtitle">
        Machine Learning Based Weather Prediction System
    </p>

    <form method="POST">

        <label>Date</label>
        <input type="date" name="date" required>

        <label>Humidity (%)</label>
        <input type="number" name="humidity"
               min="0" max="100"
               placeholder="Enter humidity"
               required>

        <label>Rainfall (mm)</label>
        <input type="number" name="rainfall"
               min="0" step="0.1"
               placeholder="Enter rainfall"
               required>

        <label>Wind Speed (km/h)</label>
        <input type="number" name="wind_speed"
               min="0" step="0.1"
               placeholder="Enter wind speed"
               required>

        <button type="submit">
            🌡️ Predict Temperature
        </button>

    </form>

    {% if prediction %}
    <div class="result">
        <p>Predicted Temperature</p>
        <h2>🌡️ {{ prediction }} °C</h2>
    </div>
    {% endif %}

    <div class="about">
        <p>
            This system uses Random Forest Machine Learning
            to predict temperature from historical weather data.
        </p>
    </div>

</div>

</body>
</html>
